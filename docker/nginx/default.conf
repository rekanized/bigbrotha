server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /app/public;
    index index.php;

    client_max_body_size 64m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    set $forwarded_proto $scheme;
    set $forwarded_port $server_port;
    set $fastcgi_https "";

    if ($http_x_forwarded_proto != "") {
        set $forwarded_proto $http_x_forwarded_proto;
    }

    if ($http_x_forwarded_port != "") {
        set $forwarded_port $http_x_forwarded_port;
    }

    if ($forwarded_proto = https) {
        set $fastcgi_https on;
    }

    location /__webrtc/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $relay_upstream relay;

        rewrite ^/__webrtc/(.*)$ /$1 break;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /__webrtc;
        proxy_redirect ~^(/.*)$ $forwarded_proto://$http_host/__webrtc$1;
        proxy_redirect ~^https?://[^/]+(/.*)$ $forwarded_proto://$http_host/__webrtc$1;
        proxy_pass http://$relay_upstream:8889;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location = /index.php {
        fastcgi_hide_header X-Powered-By;
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PORT $forwarded_port;
        fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
        fastcgi_param HTTPS $fastcgi_https if_not_empty;
        fastcgi_param REQUEST_SCHEME $forwarded_proto;
        fastcgi_param SERVER_PORT $forwarded_port;
        fastcgi_read_timeout 300;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
