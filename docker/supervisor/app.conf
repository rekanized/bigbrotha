[unix_http_server]
file=/tmp/supervisor-app.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord-app.pid
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor-app.sock

[program:service-logs]
command=/bin/sh -c "touch /tmp/nginx-access.log /tmp/nginx-error.log /tmp/php-fpm-access.log /tmp/php-fpm-error.log && exec tail -n 0 -F /tmp/nginx-access.log /tmp/nginx-error.log /tmp/php-fpm-access.log /tmp/php-fpm-error.log"
user=www-data
priority=5
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
user=www-data
priority=10
autostart=true
autorestart=unexpected
startsecs=2
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -c /etc/nginx/nginx.conf -g "daemon off;"
user=www-data
priority=20
autostart=true
autorestart=unexpected
startsecs=2
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
