name: Release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan current source and full history
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL --retry 3 "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --redact=100 --no-banner --log-opts=--all
          mkdir /tmp/public-source
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C /tmp/public-source
          /tmp/gitleaks dir /tmp/public-source --redact=100 --no-banner

  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell and Compose contracts
        run: |
          for script in publish.sh docker/*.sh; do sh -n "$script"; done
          sh tests/Docker/compose.test.sh
          git diff --check
      - name: Build isolated test image and audit locked dependencies
        run: docker build --pull --no-cache --target test -t bigbrotha-ci:test .
      - name: Run the application suite
        run: docker run --rm bigbrotha-ci:test php artisan test
      - name: Check PHP formatting
        run: docker run --rm bigbrotha-ci:test vendor/bin/pint --test
      - name: Build and validate the production image
        run: |
          docker build --pull --target final --build-arg APP_VERSION=ci --build-arg VCS_REF="$(git rev-parse HEAD)" -t bigbrotha-ci:release .
          ./docker/verify-image.sh bigbrotha-ci:release
      - name: Scan image for fixable high and critical vulnerabilities
        env:
          TRIVY_VERSION: 0.75.0
          TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        run: |
          curl -fsSL --retry 3 "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o /tmp/trivy.tar.gz
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          /tmp/trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 bigbrotha-ci:release
