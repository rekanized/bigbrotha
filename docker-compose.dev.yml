x-development: &development
  image: &dev-image ${BIGBROTHA_DEV_IMAGE:-bigbrotha-dev:local}
  environment:
    APP_ENV: local
    APP_DEBUG: "true"
    BIGBROTHA_DEV_MODE: "true"
  volumes:
    - .:/app
    - /dev/null:/app/.env:ro
    - dev-vendor:/app/vendor
    - dev-cache:/app/bootstrap/cache

services:
  app:
    <<: *development
    build:
      context: .
      dockerfile: Dockerfile
      target: development

  background:
    <<: *development

  relay:
    image: *dev-image

volumes:
  dev-vendor:
  dev-cache:
