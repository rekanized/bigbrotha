name: ${COMPOSE_PROJECT_NAME:-bigbrotha}

x-app-environment: &app-environment
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:-http://localhost}
  APP_KEY_FILE: /app/bootstrap-persist/app.key
  CACHE_STORE: database
  DB_CONNECTION: pgsql
  DB_DATABASE: ${DB_DATABASE:-bigbrotha}
  DB_HOST: database
  DB_PASSWORD: ${DB_PASSWORD:-bigbrotha}
  DB_PORT: 5432
  DB_USERNAME: ${DB_USERNAME:-bigbrotha}
  CAMERA_RECORDING_WORKER_PROCESSES: ${CAMERA_RECORDING_WORKER_PROCESSES:-1}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost/auth/google/callback}
  LOG_CHANNEL: stderr
  MEDIAMTX_API_BASE_URL: http://relay:9997
  MEDIAMTX_AUTH_CALLBACK_URL: http://web/relay/auth/mediamtx
  MEDIAMTX_BINARY_PATH: /usr/local/bin/mediamtx
  MEDIAMTX_MANAGED_EXTERNALLY: "true"
  MEDIAMTX_RTSP_INTERNAL_BASE_URL: rtsp://relay:8554
  MEDIAMTX_RTSP_LOCAL_INTERNAL_BASE_URL: rtsp://relay:8554
  MEDIAMTX_RTSP_PUBLISH_BASE_URL: rtsp://relay:8554
  MEDIAMTX_WEBRTC_INTERNAL_BASE_URL: http://relay:8889
  QUEUE_CONNECTION: database
  SESSION_DRIVER: database
  TRUSTED_PROXIES: "*"

x-app-service: &app-service
  env_file:
    - path: ./.env.docker
      required: false
  image: ${BIGBROTHA_APP_IMAGE:-rekanized/bigbrotha-app:latest}
  environment: *app-environment
  restart: unless-stopped
  volumes:
    - app-storage:/app/storage
    - ./.docker-state:/app/bootstrap-persist

services:
  app:
    <<: *app-service
    depends_on:
      database:
        condition: service_healthy

  relay:
    <<: *app-service
    depends_on:
      app:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - test -s /app/storage/app/private/mediamtx/mediamtx.yml && exec /usr/local/bin/mediamtx /app/storage/app/private/mediamtx/mediamtx.yml
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "$$context = stream_context_create(['http' => ['timeout' => 2, 'ignore_errors' => true]]); $$response = @file_get_contents('http://127.0.0.1:9997/v3/info', false, $$context); if ($$response === false) { exit(1); } foreach ($$http_response_header ?? [] as $$header) { if (preg_match('#^HTTP/\\S+ 2\\d\\d#', $$header) === 1) { exit(0); } } exit(1);",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      - "${MEDIAMTX_ICE_BIND_IP:-0.0.0.0}:${MEDIAMTX_ICE_PORT:-8190}:${MEDIAMTX_ICE_PORT:-8190}/tcp"
      - "${MEDIAMTX_ICE_BIND_IP:-0.0.0.0}:${MEDIAMTX_ICE_PORT:-8190}:${MEDIAMTX_ICE_PORT:-8190}/udp"

  web:
    image: ${BIGBROTHA_WEB_IMAGE:-rekanized/bigbrotha-web:latest}
    depends_on:
      app:
        condition: service_healthy
      relay:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/robots.txt || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    ports:
      - "${WEB_BIND_IP:-0.0.0.0}:${WEB_PORT:-8082}:80"

  worker:
    <<: *app-service
    depends_on:
      app:
        condition: service_healthy
      database:
        condition: service_healthy
    command: ["run-worker"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck-worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  scheduler:
    <<: *app-service
    depends_on:
      app:
        condition: service_healthy
      database:
        condition: service_healthy
    command: ["run-scheduler"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck-scheduler"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  database:
    image: postgres:18-alpine
    env_file:
      - path: ./.env.docker
        required: false
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-bigbrotha}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bigbrotha}
      POSTGRES_USER: ${DB_USERNAME:-bigbrotha}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-bigbrotha} -d ${DB_DATABASE:-bigbrotha}"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  app-storage:
  db-data:
