x-service: &service
  init: true
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "5"}
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  stop_grace_period: 1m

x-app: &app
  <<: *service
  image: ${BIGBROTHA_APP_IMAGE:-rekanized/bigbrotha-app:latest}
  env_file: ${BIGBROTHA_DOCKER_ENV_FILE:-./.env.docker}
  environment:
    APP_URL: ${APP_URL:?Set APP_URL in .env.docker}
    DB_DATABASE: ${DB_DATABASE:-bigbrotha}
    DB_PASSWORD: ${DB_PASSWORD:?Set a strong DB_PASSWORD in .env.docker}
    DB_USERNAME: ${DB_USERNAME:-bigbrotha}
  volumes:
    - app-storage:/app/storage
    - ./.docker-state:/app/bootstrap-persist

services:
  app:
    <<: *app
    depends_on:
      database: {condition: service_healthy}
    ports:
      - "${WEB_BIND_IP:-0.0.0.0}:${WEB_PORT:-8082}:8080"

  background:
    <<: *app
    command: ["run-background"]
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: [CMD, /usr/local/bin/healthcheck]
      timeout: 10s
      start_period: 90s

  relay:
    <<: *service
    image: ${BIGBROTHA_APP_IMAGE:-rekanized/bigbrotha-app:latest}
    command: ["run-relay"]
    # MediaMTX needs SIGTERM; the PHP-FPM base image defaults to SIGQUIT.
    stop_signal: SIGTERM
    depends_on:
      app: {condition: service_healthy}
    cap_drop: [ALL]
    ports:
      - "${MEDIAMTX_ICE_BIND_IP:-0.0.0.0}:${MEDIAMTX_ICE_PORT:-8190}:${MEDIAMTX_ICE_PORT:-8190}/tcp"
      - "${MEDIAMTX_ICE_BIND_IP:-0.0.0.0}:${MEDIAMTX_ICE_PORT:-8190}:${MEDIAMTX_ICE_PORT:-8190}/udp"
    user: www-data:www-data
    volumes:
      - app-storage:/app/storage

  database:
    <<: *service
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-bigbrotha}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a strong DB_PASSWORD in .env.docker}
      POSTGRES_USER: ${DB_USERNAME:-bigbrotha}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - db-data:/var/lib/postgresql

volumes:
  app-storage:
  db-data:
